name: Build Media3 1.9.3 FFmpeg extension

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-media3-ffmpeg-1.9.3.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Fetch exact Media3 1.9.3 source
        run: |
          git clone --depth 1 --branch 1.9.3 https://github.com/androidx/media.git media3

      - name: Download Android NDK r26b
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          unzip -q android-ndk-r26b-linux.zip
          echo "NDK_PATH=$PWD/android-ndk-r26b" >> "$GITHUB_ENV"

      - name: Download FFmpeg 6.0
        run: |
          wget -q https://ffmpeg.org/releases/ffmpeg-6.0.tar.xz
          tar -xf ffmpeg-6.0.tar.xz
          mv ffmpeg-6.0 media3/libraries/decoder_ffmpeg/src/main/jni/ffmpeg

      - name: Build FFmpeg static audio libraries
        working-directory: media3/libraries/decoder_ffmpeg/src/main/jni
        run: |
          chmod +x build_ffmpeg.sh
          ./build_ffmpeg.sh \
            "$GITHUB_WORKSPACE/media3/libraries/decoder_ffmpeg/src/main" \
            "$NDK_PATH" \
            linux-x86_64 \
            23 \
            aac mp3 ac3 eac3 truehd dca vorbis opus amrnb amrwb flac alac pcm_mulaw pcm_alaw

      - name: Configure Android SDK for Media3 JNI wrapper
        working-directory: media3
        run: |
          # Media3 1.9.3's Gradle config expects NDK 27.0.12077973.
          # FFmpeg itself remains compiled above with the officially-tested r26b.
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

      - name: Build Media3 1.9.3 decoder-ffmpeg release AAR
        working-directory: media3
        run: |
          chmod +x gradlew
          ./gradlew :lib-decoder-ffmpeg:assembleRelease --no-daemon --stacktrace

      - name: Prepare unpacked build outputs
        run: |
          rm -rf build-output
          mkdir -p build-output/aar build-output/unpacked
          echo "AAR candidates:"
          find media3 -type f -name '*.aar' -print | sort
          AAR="$(find media3 -type f -name '*.aar' -print | grep -E 'decoder[-_]ffmpeg|lib-decoder-ffmpeg' | head -1)"
          if [ -z "$AAR" ]; then
            AAR="$(find media3 -type f -name '*.aar' -print | head -1)"
          fi
          test -n "$AAR"
          echo "Using AAR: $AAR"
          cp "$AAR" build-output/aar/media3-decoder-ffmpeg-1.9.3.aar
          cd build-output/unpacked
          unzip -q ../aar/media3-decoder-ffmpeg-1.9.3.aar
          cd "$GITHUB_WORKSPACE"
          find build-output -maxdepth 4 -type f -print | sort
          sha256sum build-output/aar/media3-decoder-ffmpeg-1.9.3.aar > build-output/SHA256SUMS.txt
          find build-output/unpacked -type f -name '*.so' -print0 | sort -z | xargs -0 sha256sum >> build-output/SHA256SUMS.txt

      - name: Prepare Sketchware Pro local-library payload
        run: |
          rm -rf build-output/sketchware
          mkdir -p build-output/sketchware/d8
          cp build-output/unpacked/classes.jar build-output/sketchware/ffmpeg-extension-classes.jar
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/d8" \
            --min-api 23 \
            --lib "$ANDROID_SDK_ROOT/platforms/android-35/android.jar" \
            --output build-output/sketchware/d8 \
            build-output/unpacked/classes.jar
          mv build-output/sketchware/d8/classes.dex build-output/sketchware/classes2.dex
          rmdir build-output/sketchware/d8
          if [ -d build-output/unpacked/jni ]; then
            cp -R build-output/unpacked/jni build-output/sketchware/jni
          fi
          test -f build-output/sketchware/classes2.dex
          test -f build-output/sketchware/jni/arm64-v8a/libffmpegJNI.so
          test -f build-output/sketchware/jni/armeabi-v7a/libffmpegJNI.so
          find build-output/sketchware -type f -print | sort
          sha256sum build-output/sketchware/classes2.dex >> build-output/SHA256SUMS.txt
          find build-output/sketchware/jni -type f -name '*.so' -print0 | sort -z | xargs -0 sha256sum >> build-output/SHA256SUMS.txt

      - name: Write build manifest
        run: |
          cat > build-output/BUILD-INFO.txt <<'EOF'
          Media3 decoder_ffmpeg build for Streamix
          Media3: 1.9.3
          FFmpeg: 6.0
          FFmpeg build NDK: r26b / 26.1.10909125
          FFmpeg Android API: 23
          Renderer purpose: audio software fallback
          Enabled decoders:
          - aac
          - mp3
          - ac3
          - eac3
          - truehd
          - dca
          - vorbis
          - opus
          - amrnb
          - amrwb
          - flac
          - alac
          - pcm_mulaw
          - pcm_alaw
          The final Streamix integration should use:
          DefaultRenderersFactory.EXTENSION_RENDERER_MODE_ON
          so MediaCodec stays preferred and FFmpeg is fallback.
          EOF

      - name: Upload build outputs artifact
        uses: actions/upload-artifact@v4
        with:
          name: media3-1.9.3-ffmpeg-sketchware
          path: build-output
          if-no-files-found: error
          retention-days: 7

      - name: Commit build outputs to repository
        run: |
          git config user.name "Streamix Media3 Builder"
          git config user.email "actions@users.noreply.github.com"
          git add build-output
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Build Media3 1.9.3 FFmpeg audio extension [skip ci]"
            git push
          fi
